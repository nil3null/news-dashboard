<html lang="en"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HK Live - Original Four Blocks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#111;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
h1{font-size:19px}.sub{font-size:12px;color:#777}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1300px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);min-height:120px}
.card h2{font-size:15px;margin-bottom:10px}
ul{list-style:none}li{padding:10px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
li:hover{background:#f8f9fb}
li a{color:#111;text-decoration:none;font-size:14px;display:block}
.meta{font-size:11px;color:#999;margin-top:3px}
.btn{padding:8px 14px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px}
.note{font-size:11px;color:#999;margin-bottom:8px}
</style>
</head>
<body>
<header>
<div><h1>Live: HK • Yahoo • Tech • Tennis</h1><div class="sub" id="updateTime">Live • Updated 30/10/2026, 12:55:09 AM HKT</div></div>
<button class="btn" onclick="loadAll(true)">↻ Refresh</button>
</header>
<div class="grid">
<div class="card"><h2>🇭🇰 Hong Kong</h2><div id="hk-note" class="note"></div><div id="hk">Loading...</div></div>
<div class="card"><h2>🟣 Yahoo HK</h2><div id="yahoo-note" class="note"></div><div id="yahoo">Loading...</div></div>
<div class="card"><h2>💻 Tech Top 10</h2><div id="tech-note" class="note"></div><div id="tech">Loading...</div></div>
<div class="card"><h2>🎾 Tennis</h2><div id="tennis-note" class="note"></div><div id="tennis">Loading...</div></div>
</div>
<script>
const CACHE_KEY="news_cache_v10";
const PROXIES=[
  url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url=>`https://corsproxy.io/?${encodeURIComponent(url)}`
];
const FEEDS={
 hk:["https://hongkongfp.com/feed/","https://www.thestandard.com.hk/rss.xml","https://news.google.com/rss?hl=en-HK&gl=HK&ceid=HK:en"],
 yahoo:["https://hk.news.yahoo.com/rss"],
 tech:["https://techcrunch.com/feed/","https://www.theverge.com/rss/index.xml","https://feeds.arstechnica.com/arstechnica/index"],
 tennis:["https://www.espn.com/espn/rss/tennis/news","https://feeds.bbci.co.uk/sport/tennis/rss.xml","https://www.tennis.com/news/rss"]
};

function getCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||"{}")}catch{return{}}}
function setCache(g,items){const c=getCache();c[g]={items,time:Date.now()};localStorage.setItem(CACHE_KEY,JSON.stringify(c));}

function isAd(it){
  const t=(it.title||"").toLowerCase();
  const l=(it.link||"").toLowerCase();
  const adWords=["sponsored","advertisement","advertorial","branded content","presented by","paid content","partner content","brandlab","promoted","yahoo shopping","yahoo 購物","yahoo搜尋推廣","品牌特輯","商家廣告","精選優惠","購物優惠","品牌專欄","推廣"," tc+"];
  if(adWords.some(k=>t.includes(k))) return true;
  if(t.startsWith("techcrunch+")) return true;
  const linkBad=["/sponsored/","/brandlab/","/shopping/","shopping.yahoo","techcrunch.com/sponsor","utm_medium=sponsored","utm_source=yahoo_shopping"];
  if(linkBad.some(k=>l.includes(k))) return true;
  return false;
}

function renderList(id,items,filtered){
  const el=document.getElementById(id);
  const note=document.getElementById(id+"-note");
  if(filtered>0 && note) note.textContent=`🚫 ${filtered} ads/promos hidden`;
  else if(note) note.textContent="";
  if(!items||!items.length){ el.innerHTML=`<div style="font-size:12px;color:#777">No items yet — tap refresh.</div>`; return; }
  el.innerHTML="<ul>"+items.slice(0,12).map(it=>{
    const safeLink=it.link.replace(/'/g,"%27");
    return `<li onclick="window.open('${safeLink}','_blank','noopener')"><a href="${it.link}" target="_blank" rel="noopener">${it.title}</a><div class="meta">${it.pub?new Date(it.pub).toLocaleTimeString('en-HK',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Hong_Kong'}):''} • ${it.source}</div></li>`;
  }).join("")+"</ul>";
}

async function fetchWithFallback(url){
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store'});
      if(!r.ok) continue;
      const t=await r.text();
      if(t.includes("<item")) return t;
    }catch{}
  }
  try{
    const j=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`).then(r=>r.json());
    if(j.items) return j;
  }catch{}
  return null;
}

async function parseFeed(url){
  const raw=await fetchWithFallback(url);
  if(!raw) return [];
  if(typeof raw==='object' && raw.items){
    return raw.items.map(it=>({title:it.title,link:it.link,pub:it.pubDate,source:new URL(url).hostname.replace('www.','')}));
  }
  try{
    const d=new DOMParser().parseFromString(raw,"text/xml");
    return [...d.querySelectorAll("item")].slice(0,20).map(i=>({title:i.querySelector("title")?.textContent?.trim(),link:i.querySelector("link")?.textContent?.trim(),pub:i.querySelector("pubDate")?.textContent?.trim(),source:new URL(url).hostname.replace('www.','')})).filter(x=>x.title);
  }catch{ return []; }
}

async function loadGroup(name){
  let all=[];
  for(const u of FEEDS[name]){
    const items=await parseFeed(u);
    if(items && items.length) all=all.concat(items);
  }
  let filteredCount=0;
  all=all.filter(it=>{ if(isAd(it)){ filteredCount++; return false; } return true; });
  const seen=new Set(),uniq=[];
  for(const it of all){ if(!seen.has(it.title)){ seen.add(it.title); uniq.push(it);} }
  uniq.sort((a,b)=>new Date(b.pub)-new Date(a.pub));
  const finalItems=uniq.slice(0,12);
  if(finalItems.length){
    renderList(name,finalItems,filteredCount);
    setCache(name,finalItems);
  } else {
    const c=getCache()[name];
    if(c && c.items) renderList(name,c.items,filteredCount);
  }
}

async function loadAll(force){
  if(!force){
    const cache=getCache();
    let has=false;
    ["hk","yahoo","tech","tennis"].forEach(g=>{ if(cache[g]?.items){ renderList(g,cache[g].items,0); has=true; }});
    if(has){
      const last=Math.max(...Object.values(cache).map(v=>v.time||0));
      document.getElementById("updateTime").textContent="⚡ Instant from cache • Updating... • "+new Date(last).toLocaleTimeString('en-HK',{timeZone:'Asia/Hong_Kong'});
      await Promise.all(["hk","yahoo","tech","tennis"].map(g=>loadGroup(g)));
      document.getElementById("updateTime").textContent="Live • Updated "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"})+" HKT";
      return;
    }
  }
  document.getElementById("updateTime").textContent="Refreshing...";
  await Promise.all(["hk","yahoo","tech","tennis"].map(g=>loadGroup(g)));
  document.getElementById("updateTime").textContent="Live • Updated "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"})+" HKT";
}
loadAll(false);
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script>

</body></html>
