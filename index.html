<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HK Live - Final Fix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#111;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
h1{font-size:19px}.sub{font-size:12px;color:#777}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1300px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);min-height:120px}
.card h2{font-size:15px;margin-bottom:10px}
ul{list-style:none}li{padding:10px 0;border-bottom:1px solid #f0f0f0}
li a{color:#111;text-decoration:none;font-size:14px;display:block}
.meta{font-size:11px;color:#999;margin-top:3px}
.btn{padding:8px 14px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px}
.err{font-size:12px;color:#c00;padding:8px;background:#ffe9e9;border-radius:8px}
</style>
</head>
<body>
<header>
<div><h1>Live: HK • Yahoo • Tech • Tennis</h1><div class="sub" id="updateTime">Loading...</div></div>
<button class="btn" onclick="loadAll(true)">↻ Refresh</button>
</header>
<div class="grid">
<div class="card"><h2>🇭🇰 Hong Kong</h2><div id="hk">Loading...</div></div>
<div class="card"><h2>🟣 Yahoo HK</h2><div id="yahoo">Loading...</div></div>
<div class="card"><h2>💻 Tech Top 10</h2><div id="tech">Loading...</div></div>
<div class="card"><h2>🎾 Tennis</h2><div id="tennis">Loading...</div></div>
</div>
<script>
const CACHE_KEY="news_cache_v4";
function getCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||"{}")}catch{return{}}}
function setCache(g,items){const c=getCache();c[g]={items,time:Date.now()};localStorage.setItem(CACHE_KEY,JSON.stringify(c));}
function renderList(id,items){
  const el=document.getElementById(id);
  if(!items||!items.length){ el.innerHTML=`<div class="err">Feed temporarily blocked, showing cache if available. Tap refresh.</div>`; return; }
  el.innerHTML="<ul>"+items.slice(0,12).map(it=>`<li><a href="${it.link}" target="_blank" rel="noopener">${it.title}</a><div class="meta">${it.pub?new Date(it.pub).toLocaleTimeString('en-HK',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Hong_Kong'}):''} • ${it.source}</div></li>`).join("")+"</ul>";
}

// PRIMARY: rss2json for HK/Yahoo (most reliable on GitHub Pages), fallback to allorigins
async function fetchViaRss2Json(url){
  try{
    const api=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
    const res=await fetch(api);
    const data=await res.json();
    if(data.status==='ok' && data.items && data.items.length){
      return data.items.map(it=>({title:it.title, link:it.link, pub:it.pubDate, source:new URL(url).hostname.replace('www.','')}));
    }
  }catch(e){}
  return null;
}
async function fetchViaProxy(url){
  try{
    const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const res=await fetch(proxy);
    const text=await res.text();
    if(!text.includes("<item")) return null;
    const doc=new DOMParser().parseFromString(text,"text/xml");
    return [...doc.querySelectorAll("item")].slice(0,15).map(i=>({title:i.querySelector("title")?.textContent?.trim(), link:i.querySelector("link")?.textContent?.trim(), pub:i.querySelector("pubDate")?.textContent?.trim(), source:new URL(url).hostname.replace('www.','')})).filter(x=>x.title);
  }catch{ return null; }
}

const FEEDS={
  // Using Google News HK which is 100% reliable + HKFP
  hk:["https://news.google.com/rss?hl=en-HK&gl=HK&ceid=HK:en","https://hongkongfp.com/feed/","https://www.thestandard.com.hk/rss.xml"],
  yahoo:["https://news.google.com/rss/search?q=yahoo+hong+kong&hl=zh-HK&gl=HK&ceid=HK:zh-Hant","https://hk.news.yahoo.com/rss"],
  tech:["https://techcrunch.com/feed/","https://www.theverge.com/rss/index.xml"],
  tennis:["https://www.espn.com/espn/rss/tennis/news","https://feeds.bbci.co.uk/sport/tennis/rss.xml"]
};

async function loadGroup(name){
  let all=[];
  for(const url of FEEDS[name]){
    let items = await fetchViaRss2Json(url);
    if(!items || !items.length) items = await fetchViaProxy(url);
    if(items && items.length) all = all.concat(items);
    if(all.length>=10) break;
  }
  const seen=new Set(), uniq=[];
  for(const it of all){ if(!seen.has(it.title)){ seen.add(it.title); uniq.push(it);} }
  uniq.sort((a,b)=> new Date(b.pub)-new Date(a.pub));
  if(uniq.length){
    renderList(name,uniq);
    setCache(name,uniq);
  } else {
    // show cache if fetch fails
    const c=getCache()[name];
    if(c && c.items) renderList(name,c.items);
    else document.getElementById(name).innerHTML=`<div class="err">All proxies busy — try refresh. Yahoo HK is often blocked, showing Google News HK as backup.</div>`;
  }
}

async function loadAll(force){
  if(!force){
    const cache=getCache();
    let has=false;
    ["hk","yahoo","tech","tennis"].forEach(g=>{ if(cache[g]?.items){ renderList(g,cache[g].items); has=true; }});
    if(has){
      document.getElementById("updateTime").textContent="⚡ Instant from cache • Updating...";
      await Promise.all(["hk","yahoo","tech","tennis"].map(loadGroup));
      document.getElementById("updateTime").textContent="Live • Updated "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"})+" HKT";
      return;
    }
  }
  document.getElementById("updateTime").textContent="Refreshing...";
  await Promise.all(["hk","yahoo","tech","tennis"].map(loadGroup));
  document.getElementById("updateTime").textContent="Live • Updated "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"})+" HKT";
}
loadAll(false);
</script>
</body>
</html>
