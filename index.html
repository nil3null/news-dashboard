<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HK Live Fixed + Tech + Tennis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#111;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
h1{font-size:20px}.sub{font-size:12px;color:#777}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1300px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
ul{list-style:none}li{padding:10px 0;border-bottom:1px solid #f0f0f0}
li a{color:#111;text-decoration:none;font-size:14px;display:block}
.meta{font-size:11px;color:#999}
.btn{padding:8px 14px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer}
</style>
</head>
<body>
<header><div><h1>Live: HK • Yahoo • Tech • Tennis (Fixed)</h1><div class="sub" id="updateTime">Loading...</div></div><button class="btn" onclick="loadAll()">↻ Refresh</button></header>
<div class="grid">
<div class="card"><h2>🇭🇰 Hong Kong (Fixed)</h2><div id="hk">Loading...</div></div>
<div class="card"><h2>🟣 Yahoo HK</h2><div id="yahoo">Loading...</div></div>
<div class="card"><h2>💻 Tech Top 10</h2><div id="tech">Loading...</div></div>
<div class="card"><h2>🎾 Tennis</h2><div id="tennis">Loading...</div></div>
</div>
<script>
const PROXIES=[url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,url=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,url=>`https://corsproxy.io/?${encodeURIComponent(url)}`];
const FEEDS={
hk:["https://hongkongfp.com/feed/","https://www.thestandard.com.hk/rss.xml","https://news.google.com/rss?hl=en-HK&gl=HK&ceid=HK:en","https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml"],
yahoo:["https://hk.news.yahoo.com/rss"],
tech:["https://techcrunch.com/feed/","https://www.theverge.com/rss/index.xml","https://feeds.arstechnica.com/arstechnica/index"],
tennis:["https://www.espn.com/espn/rss/tennis/news","https://feeds.bbci.co.uk/sport/tennis/rss.xml","https://www.tennis.com/news/rss"]
};
async function fetchWithFallback(url){
 for(const makeProxy of PROXIES){
  try{const r=await fetch(makeProxy(url),{cache:'no-store'}); if(!r.ok) continue; const t=await r.text(); if(t.includes("<item")||t.includes("<?xml")) return t;}catch(e){}
 }
 try{const j=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`).then(r=>r.json()); if(j.items) return j;}catch(e){}
 return null;
}
async function parseFeed(url){
 const raw=await fetchWithFallback(url); if(!raw) return [];
 if(typeof raw==='object'&&raw.items) return raw.items.map(it=>({title:it.title,link:it.link,pub:it.pubDate,source:new URL(url).hostname.replace('www.','')}));
 try{const doc=new DOMParser().parseFromString(raw,"text/xml"); return [...doc.querySelectorAll("item")].slice(0,15).map(i=>({title:i.querySelector("title")?.textContent?.trim(),link:i.querySelector("link")?.textContent?.trim(),pub:i.querySelector("pubDate")?.textContent?.trim(),source:new URL(url).hostname.replace('www.','')})).filter(x=>x.title);}catch(e){return [];}
}
function renderList(id,items,limit){
 const el=document.getElementById(id); if(!items.length){el.innerHTML='<div style="font-size:12px;color:#c00">Retrying...</div>';return;}
 el.innerHTML="<ul>"+items.slice(0,limit).map(it=>`<li><a href="${it.link}" target="_blank">${it.title}</a><div class="meta">${it.pub?new Date(it.pub).toLocaleTimeString('en-HK',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Hong_Kong'}):''} • ${it.source}</div></li>`).join("")+"</ul>";
}
async function loadGroup(name){
 let all=[]; for(const u of FEEDS[name]){ all=all.concat(await parseFeed(u)); if(all.length>=12&&name==='hk') break; }
 const seen=new Set(),uniq=[]; for(const it of all){ if(!seen.has(it.title)){seen.add(it.title); uniq.push(it);}} uniq.sort((a,b)=>new Date(b.pub)-new Date(a.pub));
 renderList(name,uniq,10);
}
async function loadAll(){
 document.getElementById("updateTime").textContent="Fetching "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"});
 ["hk","yahoo","tech","tennis"].forEach(id=>document.getElementById(id).innerHTML='Loading...');
 await Promise.all(["hk","yahoo","tech","tennis"].map(loadGroup));
 document.getElementById("updateTime").textContent="Live • Updated "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"})+" HKT";
}
loadAll(); setInterval(loadAll,600000);
</script>
</body>
</html>
