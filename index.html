<script>
// REPLACE your whole <script> with this improved one
const PROXIES=[u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,u=>`https://corsproxy.io/?${encodeURIComponent(u)}`];
const FEEDS={
hk:["https://hongkongfp.com/feed/","https://www.thestandard.com.hk/rss.xml","https://news.google.com/rss?hl=en-HK&gl=HK&ceid=HK:en"],
yahoo:["https://hk.news.yahoo.com/rss"],
tech:["https://techcrunch.com/feed/","https://www.theverge.com/rss/index.xml"],
tennis:["https://www.espn.com/espn/rss/tennis/news","https://feeds.bbci.co.uk/sport/tennis/rss.xml"]
};
const CACHE_KEY="news_cache_v3"; const CACHE_TTL=10*60*1000; // 10 min

function getCache(){ try{return JSON.parse(localStorage.getItem(CACHE_KEY)||"{}")}catch{return {}} }
function setCache(group,items){ const c=getCache(); c[group]={items,time:Date.now()}; localStorage.setItem(CACHE_KEY,JSON.stringify(c)); }
function renderList(id,items){ const el=document.getElementById(id); if(!items.length) return; el.innerHTML="<ul>"+items.slice(0,10).map(it=>`<li><a href="${it.link}" target="_blank">${it.title}</a><div class="meta">${it.source} • ${it.pub?new Date(it.pub).toLocaleTimeString('en-HK',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Hong_Kong'}):''}</div></li>`).join("")+"</ul>"; }

async function fetchWithFallback(url){
 for(const p of PROXIES){ try{const r=await fetch(p(url),{cache:'no-store'}); if(!r.ok) continue; const t=await r.text(); if(t.includes("<item")) return t;}catch(e){} }
 try{const j=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`).then(r=>r.json()); if(j.items) return j;}catch(e){}
 return null;
}
async function parseFeed(url){
 const raw=await fetchWithFallback(url); if(!raw) return [];
 if(typeof raw==='object'&&raw.items) return raw.items.map(it=>({title:it.title,link:it.link,pub:it.pubDate,source:new URL(url).hostname.replace('www.','')}));
 try{const d=new DOMParser().parseFromString(raw,"text/xml"); return [...d.querySelectorAll("item")].slice(0,12).map(i=>({title:i.querySelector("title")?.textContent?.trim(),link:i.querySelector("link")?.textContent?.trim(),pub:i.querySelector("pubDate")?.textContent?.trim(),source:new URL(url).hostname.replace('www.','')})).filter(x=>x.title);}catch{return [];}
}
async function loadGroup(name, background=false){
 if(!background){ const cached=getCache()[name]; if(cached&&Date.now()-cached.time<CACHE_TTL){ renderList(name,cached.items); document.getElementById("updateTime").textContent="From cache • Tap ↻ to update • "+new Date(cached.time).toLocaleTimeString('en-HK',{timeZone:'Asia/Hong_Kong'}); } }
 let all=[]; for(const u of FEEDS[name]){ all=all.concat(await parseFeed(u)); if(all.length>10) break; }
 const seen=new Set(),uniq=[]; for(const it of all){ if(!seen.has(it.title)){seen.add(it.title); uniq.push(it);} } uniq.sort((a,b)=>new Date(b.pub)-new Date(a.pub));
 if(uniq.length){ renderList(name,uniq); setCache(name,uniq); }
}
async function loadAll(force=false){
 if(force) localStorage.removeItem(CACHE_KEY);
 if(!force){
   // instant cache first
   ["hk","yahoo","tech","tennis"].forEach(g=>{ const c=getCache()[g]; if(c) renderList(g,c.items); });
   document.getElementById("updateTime").textContent="Loaded instantly from cache • Updating in background...";
   // background refresh
   Promise.all(["hk","yahoo","tech","tennis"].map(g=>loadGroup(g,true))).then(()=>{ document.getElementById("updateTime").textContent="Live • Updated "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"})+" HKT"; });
   return;
 }
 document.getElementById("updateTime").textContent="Refreshing...";
 await Promise.all(["hk","yahoo","tech","tennis"].map(g=>loadGroup(g,true)));
 document.getElementById("updateTime").textContent="Live • Updated "+new Date().toLocaleString("en-HK",{timeZone:"Asia/Hong_Kong"})+" HKT";
}
// On first load: instant cache, background update
loadAll(false);
// Don't auto-refresh when coming back via back button
document.addEventListener("visibilitychange",()=>{ /* no auto fetch */ });
</script>
